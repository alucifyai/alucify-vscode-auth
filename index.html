<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alucify - Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      max-width: 420px;
      padding: 48px 40px;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .icon-success {
      background: #eafae0;
    }
    .icon-error {
      background: #fde8e8;
    }
    .icon-info {
      background: #f7fbff;
    }
    .title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #000000;
    }
    .message {
      font-size: 15px;
      line-height: 1.6;
      color: #999999;
      margin-bottom: 24px;
    }
    .hint {
      font-size: 13px;
      color: #999999;
    }
    .hint a {
      color: #6bca30;
      text-decoration: none;
      font-weight: 500;
    }
    .hint a:hover {
      text-decoration: underline;
    }
    .error .title { color: #d32f2f; }
    .brand {
      font-size: 13px;
      color: #999999;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon"></div>
    <div class="title" id="title"></div>
    <div class="message" id="message"></div>
    <div class="hint" id="hint"></div>
    <div class="brand">alucify.ai</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var state = params.get("state");
      var error = params.get("error");
      var errorDesc = params.get("error_description");

      var card = document.getElementById("card");
      var icon = document.getElementById("icon");
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var hint = document.getElementById("hint");

      if (error) {
        card.classList.add("error");
        icon.classList.add("icon-error");
        icon.textContent = "\u2716";
        title.textContent = "Authentication Failed";
        message.textContent = errorDesc || error;
        hint.textContent = "Please return to VS Code and try again.";
        return;
      }

      if (!code || !state) {
        icon.classList.add("icon-info");
        icon.textContent = "\u2139\uFE0F";
        title.textContent = "Alucify";
        message.textContent = "This page handles authentication for the Alucify VS Code extension.";
        hint.textContent = "Nothing to do here \u2014 sign in from the extension.";
        return;
      }

      // Success — redirect to VS Code
      icon.classList.add("icon-success");
      icon.textContent = "\u2713";
      title.textContent = "Authentication Successful";
      message.textContent = "You\u2019re signed in. Redirecting to VS Code\u2026";
      hint.innerHTML = 'If VS Code doesn\u2019t open automatically, <a id="manualLink" href="#">click here</a>.';

      var vscodeUri = "vscode://alucify.alucify-vscode/callback"
        + "?code=" + encodeURIComponent(code)
        + "&state=" + encodeURIComponent(state);

      document.getElementById("manualLink").href = vscodeUri;

      // Try redirect after short delay so user sees the success message
      setTimeout(function () {
        window.location.href = vscodeUri;
      }, 800);
    })();
  </script>
</body>
</html>
